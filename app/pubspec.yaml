name: bardoro
description: "Bardoro - turn epubs into chaptered .m4b audiobooks with Kokoro. Desktop app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  bardoro_core: any
  bardoro_services: any
  volley: ^0.1.0
  zero_nads: ^0.1.1
  file_picker: ^8.1.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  archive: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Starter voice profiles and glossaries, copied into a new workspace on first run.
    - assets/seed/voices/
    - assets/seed/glossaries/
